name: Nix Flake Check

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: flake check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/determinate-nix-action@v3

      - uses: DeterminateSystems/flake-checker-action@v14

      - name: Run Nix flake check
        # file+file:// reads a file whose contents are the project path.
        run: |
          mkdir -p .devenv
          printf %s "$PWD" > .devenv/root
          nix flake check --override-input devenv-root "file+file://$PWD/.devenv/root"
